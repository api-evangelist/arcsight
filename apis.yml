name: ArcSight
description: 'ArcSight is an enterprise security information and event management (SIEM) platform,
  now part of OpenText Cybersecurity (formerly Micro Focus, and HP before that). The ArcSight family
  centers on Enterprise Security Manager (ESM) for real-time correlation and threat detection, alongside
  Logger for log management and compliance, SmartConnectors for data collection and normalization,
  Intelligence for behavioral analytics, and Recon for search and investigation. ArcSight was an early
  Kleiner Perkins portfolio company. It exposes REST and web-services APIs (ESM client services, Logger
  Web Services, and SCIM user provisioning) primarily to on-premises and SaaS customer deployments rather
  than as a public developer platform.'
